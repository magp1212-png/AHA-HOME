<!doctype html>
<html lang="es">
<head>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff}
.lam{width:2120px;padding:40px 48px;background:#fff}
.lam h1{margin:0 0 6px;font-size:34px;font-weight:900;color:#21244D} .lam p.s{margin:0 0 28px;color:#5B6474;font-size:17px}
.fila{display:grid;grid-template-columns:repeat(6,300px);gap:36px;margin-bottom:34px}
.f{margin:0} .tel{width:300px;height:650px;border-radius:38px;border:8px solid #111327;overflow:hidden;box-shadow:0 18px 40px rgba(20,24,60,.22);background:#F2F4F9}
.tel img{width:100%;display:block}
figcaption{margin-top:12px;font-size:14.5px;line-height:1.35;color:#1A1C3D;font-weight:600}
.r{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:8px;background:#CFD72A;color:#21244D;font-size:11.5px;font-weight:900;text-transform:uppercase}
.sec{font-size:15px;font-weight:900;letter-spacing:.06em;color:#C8461B;margin:0 0 14px}
</style>
</helmet>
<div class="lam">
 <h1>Versión 4 · App fusionada AHA HOME + AHA HOGAR (pantallas reales)</h1>
 <p class="s">Aprueba tu orden · fichas de producto · acta de conformidad · servicio cerrado · historial con buscador · Mensajes y soporte directo · caja con OK de retiro · centro de mando</p>
 <div class="sec">CLIENTE</div>
 <div class="fila">
  <figure class="f"><div class="tel"><img src="img/f01.jpg" alt="Pestaña Mensajes: chat de cada pedido y Soporte AHA HOME"></div><figcaption><span class="r">Cliente</span>Pestaña Mensajes: chat de cada pedido y Soporte AHA HOME</figcaption></figure>

  <figure class="f"><div class="tel"><img src="img/f04.jpg" alt="Aprueba tu orden: 3 puntos o «No reconozco esta orden»"></div><figcaption><span class="r">Cliente</span>Aprueba tu orden: 3 puntos o «No reconozco esta orden»</figcaption></figure>

  <figure class="f"><div class="tel"><img src="img/f06.jpg" alt="Cierre: el código aparece cuando llega el técnico"></div><figcaption><span class="r">Cliente</span>Cierre: el código aparece cuando llega el técnico</figcaption></figure>
 </div>
 <div class="fila">
  <figure class="f"><div class="tel"><img src="img/f07.jpg" alt="Acta de conformidad: puntos del servicio"></div><figcaption><span class="r">Cliente</span>Acta de conformidad: puntos del servicio</figcaption></figure>

 </div>

 </div>
</div>
